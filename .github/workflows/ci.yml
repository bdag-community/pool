name: Verify Go component

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pool_submission_journal_test_ci
          POSTGRES_PASSWORD: test-only
        options: >-
          --health-cmd "pg_isready -U postgres -d pool_submission_journal_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432/tcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
      - name: Test Go and PostgreSQL contracts
        env:
          POOL_SUBMISSION_JOURNAL_TEST_DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/pool_submission_journal_test_ci?sslmode=disable
        run: go test -mod=readonly -p 1 ./...
      - run: go build -mod=readonly ./...
